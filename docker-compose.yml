services:
  pgadmin:
    image: dpage/pgadmin4
    ports:
      - "5050:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD}
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      - postgres
    restart: unless-stopped

  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: mydb
      DATABASE_HOST: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
  
  web: 
    build: .
    user: root
    entrypoint: []
    working_dir: /myapp
    command: bundle exec puma -b tcp://0.0.0.0:3001
    ports:
      - "3001:3001"
    volumes:
      - .:/myapp
    environment:
      RAILS_ENV: development
      DATABASE_HOST: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_USER: admin
      REDIS_URL: redis://redis:6379/1
    depends_on:
      - postgres
      - redis
    restart: unless-stopped
  
  redis:
    image: redis:7-alpine
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    restart: unless-stopped
  
  frontend:
    image: node:22-alpine
    working_dir: /myapp/frontend
    volumes:
      - .:/myapp
    ports:
      - "3000:3000"
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    depends_on:
      - web
    restart: unless-stopped

volumes:
  pgadmin_data:
  postgres_data:
  redis_data:   